<div class="experience-container">
  <h2>Experience</h2>

  <div class="filters" role="group" aria-label="Experience categories">
    @for (category of categories; track category) {
      <button
        type="button"
        [class.active]="selectedCategory() === category"
        [attr.aria-pressed]="selectedCategory() === category"
        (click)="selectCategory(category)"
      >
        {{ category }}
      </button>
    }
  </div>

  <div class="experience-grid">
    @for (experience of filteredExperiences(); track experience.id) {
      <app-experience-card
        [experience]="experience"
        (selected)="openExperience($event)"
      />
    } @empty {
      <p>No experience found in this category.</p>
    }
  </div>
</div>

@if (selectedExperience(); as experience) {
  <app-experience-detail
    [experience]="experience"
    (closed)="closeExperience()"
  />
}
